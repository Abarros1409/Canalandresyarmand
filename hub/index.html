      ${(b.pillars||[]).length ? `<ul class="clean list-items">${b.pillars.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>` : `<p class="muted small">Sin pilares.</p>`}
    </section>
    <section class="panel">
      <div class="panel-head"><h3>Series y formatos</h3><button class="link" data-act="editSeries">Editar</button></div>
      ${(b.series||[]).length ? `<div class="series">${b.series.map(s=>`<div><b>${esc(s.name)}</b><p class="small muted">${esc(s.desc||"")}</p></div>`).join("")}</div>` : `<p class="muted small">Sin series definidas.</p>`}
    </section>
    <section class="panel">
      <div class="panel-head"><h3>Identidad visual</h3><button class="link" data-act="editVisual">Editar</button></div>
      ${(b.palette||[]).length ? `<div class="swatches" style="margin-bottom:12px">${b.palette.map(c=>`<div class="sw"><i style="background:${/^#[0-9a-f]{3,8}$/i.test(c)?c:"transparent"}"></i><span>${esc(c)}</span></div>`).join("")}</div>` : ""}
      ${b.visual ? `<p style="white-space:pre-wrap">${esc(b.visual)}</p>` : `<p class="muted small">Definan colores, tipografía de subtítulos, portada y cómo se ven en cámara.</p>`}
    </section>
    <section class="panel">
      <div class="panel-head"><h3>Bio y descripción</h3><button class="link" data-act="editBio">Editar</button></div>
      ${b.bio ? `<p style="white-space:pre-wrap">${esc(b.bio)}</p><button class="btn sm ghost" style="margin-top:10px" data-act="copyText" data-k="bio">Copiar</button>` : `<p class="muted small">Escriban la bio una vez elegido el nombre.</p>`}
    </section>
    <section class="panel" style="grid-column:1/-1">
      <div class="panel-head"><h3>Ganchos que funcionan</h3><button class="link" data-act="editList" data-k="hooks" data-t="Ganchos que funcionan">Editar</button></div>
      <p class="small muted" style="margin-bottom:8px">Guarden acá los ganchos que mejor retención dieron, para reutilizar la estructura.</p>
      ${(b.hooks||[]).length ? `<ul class="clean list-items">${b.hooks.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>` : `<p class="muted small">Se llena con los datos de Estadísticas.</p>`}
    </section>
  </div>`;
};
A.editCore = () => { const b = S.brand||{}; formModal({ title:"Promesa, público y tono", fields:[
  { name:"promise", label:"Promesa del canal", type:"textarea", rows:2 }, { name:"audience", label:"Para quién", type:"textarea", rows:2 }, { name:"tone", label:"Tono", type:"textarea", rows:2 }],
  values:b, onSubmit: v => saveCfg("brand", v) }); };
A.editList = el => { const k = el.dataset.k; const t = el.dataset.t;
  formModal({ title:t, fields:[{ name:"v", label:"Uno por línea", type:"textarea", rows:8 }], values:{ v:((S.brand||{})[k]||[]).join("\n") }, onSubmit: v => saveCfg("brand", { [k]: lines(v.v) }) }); };
A.editSeries = () => formModal({ title:"Series y formatos", fields:[{ name:"v", label:"Una por línea, con el formato Nombre: descripción", type:"textarea", rows:8 }],
  values:{ v:((S.brand||{}).series||[]).map(s=>s.name+(s.desc?": "+s.desc:"")).join("\n") },
  onSubmit: v => saveCfg("brand", { series: lines(v.v).map(l => { const i = l.indexOf(":"); return i>0 ? { name:l.slice(0,i).trim(), desc:l.slice(i+1).trim() } : { name:l, desc:"" }; }) }) });
A.editVisual = () => formModal({ title:"Identidad visual", fields:[
  { name:"palette", label:"Colores en hex, separados por coma", placeholder:"#1F5E8C, #F2B705" }, { name:"visual", label:"Notas de estilo", type:"textarea", rows:6, placeholder:"Tipografía de subtítulos, portada, encuadre, luz, música" }],
  values:{ palette:((S.brand||{}).palette||[]).join(", "), visual:(S.brand||{}).visual||"" },
  onSubmit: v => saveCfg("brand", { palette: v.palette.split(",").map(x=>x.trim()).filter(Boolean), visual:v.visual }) });
A.editBio = () => formModal({ title:"Bio y descripción", fields:[{ name:"bio", label:"Bio", type:"textarea", rows:5 }], values:S.brand||{}, onSubmit: v => saveCfg("brand", v) });
const namePatch = (id, patch) => saveCfg("brand", { names: itemPatch((S.brand||{}).names, id, patch) });
A.newName = () => formModal({ title:"Nombre candidato", fields:[{ name:"name", label:"Nombre", required:true },{ name:"why", label:"Por qué", type:"textarea", rows:2 }],
  onSubmit: v => namePatch(uid(), { name:v.name, why:v.why, votes: H.ME?{[H.ME]:true}:{}, order: nextOrder((S.brand||{}).names) }) });
A.voteName = el => { const p = el.dataset.p; if (!H.ME){ H.chooseMe(); return; } if (H.ME!==p){ toast(`Solo ${PEOPLE[p].name} puede votar por sí mismo.`); return; }
  const n = toList((S.brand||{}).names).find(x=>x.id===el.dataset.id); if(!n) return;
  namePatch(n.id, { votes:{ [p]: !(n.votes||{})[p] } }); };
A.chooseName = el => { const list = toList((S.brand||{}).names); const cur = list.find(n=>n.id===el.dataset.id); if(!cur) return;
  const raw = (S.brand||{}).names; const m = Array.isArray(raw) ? toMap(raw) : {};
  list.forEach(n => { if (n.id===cur.id) m[n.id] = { ...(m[n.id]||{}), chosen: !cur.chosen }; else if (n.chosen) m[n.id] = { ...(m[n.id]||{}), chosen:false }; });
  saveCfg("brand", { names:m }); };
A.delName = el => namePatch(el.dataset.id, { deleted:true });
A.copyText = async el => { const t = (S.brand||{})[el.dataset.k] || ""; try { await navigator.clipboard.writeText(t); toast("Copiado."); } catch(e){ toast("No se pudo copiar: seleccioná el texto a mano."); } };
A.aiNames = async () => {
  const out = $("#aiNamesOut"); const sample = await getSample();
  if (!sample){ toast("Pedirle nombres a Claude solo funciona con el hub abierto dentro de Claude."); return; }
  if (UI.sampleBusy) return; UI.sampleBusy = true; out.innerHTML = `<div class="ai-box" style="margin:12px 0 0">${thinkingHTML()}</div>`;
  const prev = toList((S.brand||{}).names).map(n=>n.name).join(", ");
  const prompt = `${projectContext()}

Nombres ya considerados: ${prev || "ninguno"}.
Proponé 6 nombres nuevos para el canal/podcast. Cortos (1 a 3 palabras), fáciles de decir en español, que funcionen como @ en redes y que no queden chicos cuando el contenido crezca hacia emprender. Podés jugar con Rotterdam, el puerto, empezar de cero, Uruguay y España, o aprender en público, sin forzarlo.
Para cada uno: "name" y "why" (una frase).
Respondé solo con JSON: {"names":[{"name":"","why":""}]}`;
  try {
    const res = await sample.json(prompt); const names = (res && Array.isArray(res.names) ? res.names : []).filter(n=>n&&n.name).slice(0,6);
    H._names = names.map(n=>({ name:String(n.name).slice(0,60), why:String(n.why||"").slice(0,200) }));
    out.innerHTML = `<div class="ai-box" style="margin:12px 0 0"><div class="spread"><b>Sugerencias de Claude</b><button class="link" data-act="aiNamesClose">Cerrar</button></div><div class="ai-out">${H._names.map((n,ix)=>`<div class="ai-item"><div><b>${esc(n.name)}</b><p class="small muted">${esc(n.why)}</p></div><button class="btn sm ghost" data-act="aiNameKeep" data-ix="${ix}">Agregar</button></div>`).join("")||'<p class="muted">Sin sugerencias. Probá de nuevo.</p>'}</div></div>`;
  } catch(e){ out.innerHTML = `<div class="ai-box" style="margin:12px 0 0"><p class="muted">${esc(aiErr(e))}</p></div>`; }
  finally { UI.sampleBusy = false; }
};
A.aiNamesClose = () => { const o = $("#aiNamesOut"); if (o) o.innerHTML = ""; };
A.aiNameKeep = async el => { const n = (H._names||[])[+el.dataset.ix]; if(!n) return; el.disabled = true;
  const ok = await namePatch(uid(), { name:n.name, why:n.why+" (sugerido por Claude)", votes:{}, order: nextOrder((S.brand||{}).names) });
  el.textContent = ok ? "Agregado" : "Agregar"; if(!ok) el.disabled = false; };

/* ===================== DISTRIBUCIÓN ===================== */
V.marketing = () => {
  const m = S.marketing || {};
  const days = m.days || [];
  const states = [["pendiente","Por probar",""],["probando","Probando","y"],["funciona","Funciona","g"],["no","No funcionó","r"]];
  return `
  <div class="head"><div><h2>Distribución</h2><p class="muted">Cómo y dónde sale cada video. Una plataforma principal para medir y aprender; las otras reciben el mismo archivo.</p></div></div>
  <div class="grid g2">
    <section class="panel">
      <div class="panel-head"><h3>Plataformas</h3><button class="link" data-act="editPlatforms">Editar</button></div>
      <p class="small muted">Principal</p><p style="font-size:18px;font-weight:600;margin-bottom:8px">${m.main?esc(m.main):'Sin decidir <a class="link" href="#decisiones" style="font-weight:400">(se decide en Decisiones)</a>'}</p>
      <p class="small muted">Copias</p><div class="row" style="margin-top:4px">${((m.secondary||[]).length ? m.secondary : PLATFORMS.filter(p=>p!=="YouTube"&&p!==m.main)).map(p=>`<span class="tag">${esc(p)}</span>`).join("")}</div>
    </section>
    <section class="panel">
      <h3>Días de publicación</h3>
      <div class="row" style="margin:6px 0 8px">${DAYS.map(d=>`<button class="chip" aria-pressed="${days.includes(d)}" data-act="toggleDay" data-v="${d}">${d}</button>`).join("")}</div>
      <p class="small muted">${days.length} días marcados. Objetivo actual: ${H.weeklyTarget()} por semana.</p>
    </section>
    <section class="panel">
      <div class="panel-head"><h3>Antes de publicar</h3><button class="link" data-act="editMList" data-k="checklist" data-t="Checklist antes de publicar">Editar</button></div>
      ${(m.checklist||[]).length ? `<ul class="clean">${m.checklist.map((c,ix)=>`<li class="check"><input type="checkbox" id="ck${ix}"><label class="t" for="ck${ix}">${esc(c)}</label></li>`).join("")}</ul><p class="small muted" style="margin-top:6px">Las marcas se borran al recargar: es una lista para repasar en cada video.</p>` : `<p class="muted small">Sin checklist.</p>`}
    </section>
    <section class="panel">
      <div class="panel-head"><h3>Hashtags y palabras clave</h3><button class="link" data-act="editMList" data-k="hashtags" data-t="Hashtags y palabras clave">Editar</button></div>
      ${(m.hashtags||[]).length ? `<div class="row">${m.hashtags.map(h=>`<span class="tag">${esc(h)}</span>`).join("")}</div><button class="btn sm ghost" style="margin-top:10px" data-act="copyTags">Copiar todos</button>` : `<p class="muted small">Agreguen los que usan, uno por línea.</p>`}
    </section>
    <section class="panel" style="grid-column:1/-1">
      <div class="panel-head"><h3>Tácticas de crecimiento</h3><button class="btn sm ghost" data-act="newTactic">Agregar</button></div>
      ${toList(m.tactics).length ? `<div class="scroll-x"><table><thead><tr><th>Táctica</th><th>Estado</th><th></th></tr></thead><tbody>${toList(m.tactics).map(t=>{ const s = states.find(x=>x[0]===t.state)||states[0];
        return `<tr><td>${esc(t.text)}${t.note?`<br><span class="small muted">${esc(t.note)}</span>`:""}</td><td><button class="tag ${s[2]}" style="cursor:pointer" data-act="cycleTactic" data-id="${t.id}" title="Cambiar estado">${s[1]}</button></td><td><button class="link" data-act="editTactic" data-id="${t.id}">Editar</button></td></tr>`; }).join("")}</tbody></table></div>` : empty("Sin tácticas cargadas.")}
    </section>
    <section class="panel" style="grid-column:1/-1">
      <div class="panel-head"><h3>Colaboraciones y contactos</h3><button class="link" data-act="editMList" data-k="collabs" data-t="Colaboraciones y contactos">Editar</button></div>
      ${(m.collabs||[]).length ? `<ul class="clean list-items">${m.collabs.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>` : `<p class="muted small">Otros estudiantes creadores, asociaciones de la universidad, gente a la que entrevistar más adelante.</p>`}
    </section>
  </div>`;
};
A.editPlatforms = () => { const m = S.marketing||{}; formModal({ title:"Plataformas", fields:[
  { name:"main", label:"Principal", type:"select", options:[["","Sin decidir"],...PLATFORMS.map(p=>[p,p])] },
  { name:"secondary", label:"Copias (una por línea)", type:"textarea", rows:3 }],
  values:{ main:m.main||"", secondary:(m.secondary||[]).join("\n") }, onSubmit: v => saveCfg("marketing", { main:v.main, secondary:lines(v.secondary) }) }); };
A.toggleDay = el => { const d = el.dataset.v; const days = new Set((S.marketing||{}).days||[]); days.has(d) ? days.delete(d) : days.add(d);
  saveCfg("marketing", { days: DAYS.filter(x => days.has(x)) }); };
A.editMList = el => { const k = el.dataset.k; formModal({ title:el.dataset.t, fields:[{ name:"v", label:"Uno por línea", type:"textarea", rows:8 }],
  values:{ v:((S.marketing||{})[k]||[]).join("\n") }, onSubmit: v => saveCfg("marketing", { [k]: lines(v.v) }) }); };
A.copyTags = async () => { try { await navigator.clipboard.writeText(((S.marketing||{}).hashtags||[]).join(" ")); toast("Copiados."); } catch(e){ toast("No se pudo copiar: seleccioná el texto a mano."); } };
const tacticFields = [{ name:"text", label:"Táctica", required:true },{ name:"state", label:"Estado", type:"select", options:[["pendiente","Por probar"],["probando","Probando"],["funciona","Funciona"],["no","No funcionó"]] },{ name:"note", label:"Nota", type:"textarea", rows:2 }];
const tacticPatch = (id, patch) => saveCfg("marketing", { tactics: itemPatch((S.marketing||{}).tactics, id, patch) });
A.newTactic = () => formModal({ title:"Nueva táctica", fields:tacticFields, values:{ state:"pendiente" }, onSubmit: v => tacticPatch(uid(), { ...v, order: nextOrder((S.marketing||{}).tactics) }) });
A.editTactic = el => { const t = toList((S.marketing||{}).tactics).find(x=>x.id===el.dataset.id); if(!t) return;
  formModal({ title:"Editar táctica", fields:tacticFields, values:t, onSubmit: v => tacticPatch(t.id, v),
    onDelete: () => tacticPatch(t.id, { deleted:true }) }); };
A.cycleTactic = el => { const order = ["pendiente","probando","funciona","no"]; const t = toList((S.marketing||{}).tactics).find(x=>x.id===el.dataset.id); if(!t) return;
  tacticPatch(t.id, { state: order[(order.indexOf(t.state||"pendiente")+1)%order.length] }); };
})();

</script>
<script>
(() => {
"use strict";
const H = window.__HUB;
const { CATS, PLATFORMS, PEOPLE, PHASES, REVIEW_GUIDES, COLS, CFG, S, UI, store, $, esc, uid, todayISO, parseISO, fmt, fmtFull, lines, num, nfmt, person, optList,
  weekInfo, weekRange, phaseOf, toast, saveDoc, patchDoc, delDoc, saveCfg, byId, toList, formModal, infoModal, closeModal, empty } = H;
const V = H.views, A = H.actions;

/* ===================== ESTADÍSTICAS ===================== */
function barChart(items){
  if (!items.length) return "";
  const W = 640, Hh = 220, pl = 44, pb = 28, pt = 10;
  const max = Math.max(...items.map(i=>i.v), 1);
  const step = (W-pl-8)/items.length, bw = Math.min(38, step*0.66);
  const ticks = [0, max/2, max];
  const best = Math.max(...items.map(i=>i.v));
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Vistas por video">
    ${ticks.map(t=>{ const y = pt+(Hh-pt-pb)*(1-t/max); return `<line class="gl" x1="${pl}" x2="${W-4}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${nfmt(t)}</text>`; }).join("")}
    ${items.map((it,ix)=>{ const h = (Hh-pt-pb)*(it.v/max); const x = pl+ix*step+(step-bw)/2; const y = Hh-pb-h;
      return `<rect class="barv ${it.v===best?"best":""}" x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="3"><title>${esc(it.label)}: ${nfmt(it.v)} vistas</title></rect><text x="${x+bw/2}" y="${Hh-10}" text-anchor="middle">${esc(it.short)}</text>`; }).join("")}
  </svg>`;
}
function lineChart(pts){
  if (pts.length < 2) return "";
  const W = 640, Hh = 200, pl = 44, pb = 28, pt = 12;
  const max = Math.max(...pts.map(p=>p.v)), min = Math.min(...pts.map(p=>p.v)); const span = Math.max(max-min, 1);
  const x = ix => pl + ix*((W-pl-12)/(pts.length-1)); const y = v => pt + (Hh-pt-pb)*(1-(v-min)/span);
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Seguidores en el tiempo">
    ${[min, min+span/2, max].map(t=>`<line class="gl" x1="${pl}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${nfmt(t)}</text>`).join("")}
    <polyline class="ln" points="${pts.map((p,ix)=>x(ix)+","+y(p.v)).join(" ")}"/>
    ${pts.map((p,ix)=>`<circle class="pt" cx="${x(ix)}" cy="${y(p.v)}" r="3.5"><title>${fmt(p.date)}: ${nfmt(p.v)}</title></circle>${ix===0||ix===pts.length-1?`<text x="${x(ix)}" y="${Hh-10}" text-anchor="${ix===0?"start":"end"}">${fmt(p.date)}</text>`:""}`).join("")}
  </svg>`;
}
V.stats = () => {
  const st = [...S.stats].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const totalViews = st.reduce((s,x)=>s+num(x.views),0);
  const withRet = st.filter(x=>x.retention!==""&&x.retention!=null&&!isNaN(num(x.retention)));
  const avgRet = withRet.length ? withRet.reduce((s,x)=>s+num(x.retention),0)/withRet.length : null;
  const plats = [...new Set(S.followers.map(f=>f.platform).filter(Boolean))];
  if (!UI.statPlatform || !plats.includes(UI.statPlatform)) UI.statPlatform = ((S.marketing||{}).main && plats.includes(S.marketing.main)) ? S.marketing.main : plats[0] || null;
  const fol = S.followers.filter(f=>f.platform===UI.statPlatform).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const latestByPlat = plats.map(p => { const l = S.followers.filter(f=>f.platform===p).sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0]; return l?num(l.count):0; });
  const totalFol = latestByPlat.reduce((s,x)=>s+x,0);
  const byCat = CATS.map(c => { const xs = st.filter(x=>x.category===c); if(!xs.length) return null;
    const r = xs.filter(x=>x.retention!==""&&x.retention!=null); return { c, n:xs.length, views: xs.reduce((s,x)=>s+num(x.views),0)/xs.length, ret: r.length ? r.reduce((s,x)=>s+num(x.retention),0)/r.length : null }; }).filter(Boolean)
    .sort((a,b)=>(b.ret??-1)-(a.ret??-1));
  const last = st.slice(-15).map(x => ({ v:num(x.views), label:x.title, short:fmt(x.date) }));
  return `
  <div class="head"><div><h2>Estadísticas</h2><p class="muted">Registren cada video a las 48 horas. Lo que más importa al principio es la retención (qué porcentaje mira hasta el final), no las vistas.</p></div>
    <div class="row"><button class="btn ghost" data-act="newFollowers">Registrar seguidores</button><button class="btn" data-act="newStat">Registrar video</button></div></div>
  <div class="grid g4" style="margin-bottom:16px">
    <section class="panel"><p class="muted small">Videos registrados</p><p class="kpi">${st.length}</p></section>
    <section class="panel"><p class="muted small">Vistas totales</p><p class="kpi">${nfmt(totalViews)}</p></section>
    <section class="panel"><p class="muted small">Retención media</p><p class="kpi">${avgRet===null?"–":Math.round(avgRet)+"%"}</p></section>
    <section class="panel"><p class="muted small">Seguidores (suma de plataformas)</p><p class="kpi">${nfmt(totalFol)}</p></section>
  </div>
  <div class="grid g2" style="margin-bottom:16px">
    <section class="panel"><h3>Vistas por video</h3>${last.length ? barChart(last) + `<p class="small muted">En amarillo, el video con más vistas de los últimos ${last.length}.</p>` : empty("Cuando registren el primer video aparece el gráfico.", "Registrar video", "newStat")}</section>
    <section class="panel"><div class="panel-head"><h3>Seguidores</h3>${plats.length>1?`<select style="width:auto" data-change="statPlat" aria-label="Plataforma">${optList(plats, UI.statPlatform)}</select>`:""}</div>
      ${fol.length>=2 ? lineChart(fol.map(f=>({ v:num(f.count), date:f.date }))) : empty(fol.length ? "Con un registro más aparece la curva." : "Anoten cuántos seguidores tienen una vez por semana.", "Registrar seguidores", "newFollowers")}</section>
  </div>
  <section class="panel" style="margin-bottom:16px"><h3>Qué temas enganchan</h3>
    ${byCat.length ? `<div class="scroll-x"><table><thead><tr><th>Categoría</th><th class="num">Videos</th><th class="num">Vistas medias</th><th class="num">Retención media</th></tr></thead><tbody>${byCat.map(r=>`<tr><td>${esc(r.c)}</td><td class="num">${r.n}</td><td class="num">${nfmt(r.views)}</td><td class="num">${r.ret===null?"–":Math.round(r.ret)+"%"}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted small">Aparece cuando haya videos registrados con categoría.</p>`}
  </section>
  <section class="panel"><h3>Registro</h3>
    ${st.length ? `<div class="scroll-x"><table><thead><tr><th>Video</th><th>Fecha</th><th>Plataforma</th><th class="num">Vistas</th><th class="num">Retención</th><th class="num">Likes</th><th class="num">Coment.</th><th class="num">Seguidores +</th></tr></thead><tbody>
      ${[...st].reverse().map(x=>`<tr><td><button class="link" style="text-decoration:none;color:var(--ink);text-align:left;font-size:14px" data-act="editStat" data-id="${x.id}">${esc(x.title)}</button></td><td>${fmt(x.date)}</td><td>${esc(x.platform||"")}</td><td class="num">${nfmt(num(x.views))}</td><td class="num">${x.retention!==""&&x.retention!=null?Math.round(num(x.retention))+"%":"–"}</td><td class="num">${nfmt(num(x.likes))}</td><td class="num">${nfmt(num(x.comments))}</td><td class="num">${nfmt(num(x.follows))}</td></tr>`).join("")}
    </tbody></table></div>` : `<p class="muted small">Sin registros todavía.</p>`}
    ${S.followers.length ? `<div class="divider"></div><p class="small muted">Registros de seguidores: ${[...S.followers].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,8).map(f=>`<button class="link" data-act="editFollowers" data-id="${f.id}">${fmt(f.date)} ${esc(f.platform)}: ${nfmt(num(f.count))}</button>`).join(" , ")}</p>` : ""}
  </section>`;
};
const statFields = () => [
  { name:"title", label:"Video", required:true }, { name:"date", label:"Fecha de publicación", type:"date" },
  { name:"platform", label:"Plataforma", type:"select", options:PLATFORMS }, { name:"category", label:"Categoría", type:"select", options:CATS },
  { name:"views", label:"Vistas", type:"number" }, { name:"retention", label:"Retención media o % que mira hasta el final", type:"number", hint:"Número del 0 al 100" },
  { name:"likes", label:"Likes", type:"number" }, { name:"comments", label:"Comentarios", type:"number" }, { name:"shares", label:"Compartidos", type:"number" },
  { name:"follows", label:"Seguidores ganados", type:"number" }, { name:"notes", label:"Qué aprendimos de este video", type:"textarea", rows:3 }
];
const statOut = v => ({ ...v, views:num(v.views), retention: v.retention===""?"":Math.max(0,Math.min(100,num(v.retention))), likes:num(v.likes), comments:num(v.comments), shares:num(v.shares), follows:num(v.follows) });
A.newStat = () => formModal({ title:"Registrar video", fields:statFields(), values:{ date:todayISO(), platform:(S.marketing||{}).main||PLATFORMS[0], category:CATS[0] }, onSubmit: v => saveDoc("stats", uid(), statOut(v)) });
A.statFromPiece = el => { const p = byId("pieces", el.dataset.id); if(!p) return;
  const ex = S.stats.find(s=>s.pieceId===p.id);
  if (ex){ A.editStat({ dataset:{ id:ex.id } }); return; }
  formModal({ title:"Métricas del video", fields:statFields(), values:{ title:p.title, date:p.publishedAt||todayISO(), platform:p.platform||(S.marketing||{}).main||PLATFORMS[0], category:p.category||CATS[0] },
    onSubmit: v => saveDoc("stats", uid(), { ...statOut(v), pieceId:p.id }) }); };
A.editStat = el => { const s = byId("stats", el.dataset.id); if(!s) return;
  formModal({ title:"Editar registro", fields:statFields(), values:s, onSubmit: v => patchDoc("stats", s.id, statOut(v)), onDelete: () => delDoc("stats", s.id) }); };
const folFields = [{ name:"date", label:"Fecha", type:"date" },{ name:"platform", label:"Plataforma", type:"select", options:PLATFORMS },{ name:"count", label:"Seguidores", type:"number", required:true }];
A.newFollowers = () => formModal({ title:"Registrar seguidores", fields:folFields, values:{ date:todayISO(), platform:(S.marketing||{}).main||PLATFORMS[0] }, onSubmit: v => saveDoc("followers", uid(), { ...v, count:num(v.count) }) });
A.editFollowers = el => { const f = byId("followers", el.dataset.id); if(!f) return;
  formModal({ title:"Editar seguidores", fields:folFields, values:f, onSubmit: v => patchDoc("followers", f.id, { ...v, count:num(v.count) }), onDelete: () => delDoc("followers", f.id) }); };
A.statPlat = el => { UI.statPlatform = el.value; H.render(); };

/* ===================== REVISIONES ===================== */
V.revisiones = () => {
  const rs = [...S.retros].sort((a,b)=>(b.week||0)-(a.week||0) || (b.date||"").localeCompare(a.date||""));
  const dots = n => { n = Math.round(num(n)); return n ? `<span aria-label="${n} de 5">${"●".repeat(n)}<span class="muted">${"●".repeat(5-n)}</span></span>` : "–"; };
  return `
  <div class="head"><div><h2>Revisiones</h2><p class="muted">Diez minutos por semana en la reunión: qué funcionó, qué no y qué cambian. La energía de cada uno avisa antes de que alguien se queme o se aburra.</p></div><button class="btn" data-act="newRetro">Nueva revisión semanal</button></div>
  <div class="grid g2" style="margin-bottom:16px">${["s6","d90"].map(k=>`<section class="panel"><h3>${REVIEW_GUIDES[k].title}</h3><ul style="margin:0;padding-left:18px">${REVIEW_GUIDES[k].qs.map(q=>`<li style="margin:4px 0">${esc(q)}</li>`).join("")}</ul><button class="btn sm ghost" style="margin-top:10px" data-act="newRetro" data-kind="${k}">Hacer esta revisión</button></section>`).join("")}</div>
  ${rs.length ? `<div class="stack-v">${rs.map(r=>`<section class="panel flat">

function navCount(id){
  if (id==="ideas") return S.ideas.filter(i=>["cruda","desarrollar","lista"].includes(i.status||"cruda")).length;
  if (id==="produccion") return S.pieces.filter(p=>p.stage!=="publicado").length;
  if (id==="decisiones") return S.decisions.filter(d=>d.status!=="decidida").length;

function stackHTML(){
  const wi = weekInfo(); const n = wi.before ? 0 : wi.n;
  const goalsPct = w => { const d = S.weeks.find(x=>x.n===w); const g = d ? toList(d.goals) : []; return g.length ? g.filter(x=>x.done).length/g.length : 0; };
  const blocks = Array.from({length:12}, (_,i) => { const w = i+1; const p = phaseOf(w);
    let cls = `ctr p${p}`, style = "";
    if (w < n) cls += " done"; else if (w === n) cls += " now"; else { const pct = goalsPct(w); if (pct>0){ cls += " part"; style = `--fill:${Math.round(pct*100)}%`; } }
    return `<button class="${cls}" style="${style}" data-act="gotoWeek" data-w="${w}" aria-label="Semana ${w}${w===n?", actual":""}" title="Semana ${w}"></button>`; }).join("");
  const lbl = wi.before ? `Arranca en ${wi.daysTo} ${wi.daysTo===1?"día":"días"}` : n>12 ? "Día 90 cumplido" : `Semana ${n} de 12`;
  return `<div class="stack-wrap"><span class="stack-label">${lbl}</span><div class="stack" role="group" aria-label="Las 12 semanas del plan">${blocks}</div></div>`;
}

function syncMe(){
  if (!H.MYID || !S.loaded.people) return;
  const mine = Object.keys(PEOPLE).find(k => claimedBy(k)===H.MYID);
  if (mine){
    const d = $("#dlg"); if (d.open && d.dataset.kind==="who" && !d.dataset.force) d.close();
    if (H.ME!==mine){ H.ME = mine; render(); }
  } else if (H.ME && !H.READONLY){
    /* la cuenta todavía no está vinculada: se confirma quién es en vez de suponerlo */
    H.ME = null; render();
    setTimeout(() => { if (!H.ME) H.chooseMe(); }, 300);
  }
}
H.syncMe = syncMe;
async function pickMe(k){
  H.ME = k; closeModal(); render();
  if (!H.MYID || H.READONLY || !H.DB) return;
  const patch = { [k]: H.MYID };
  Object.keys(PEOPLE).forEach(o => { if (o!==k && claimedBy(o)===H.MYID) patch[o] = ""; });
  if (claimedBy(k)!==H.MYID) await saveCfg("people", patch);
}

    <div class="row">${Object.entries(PEOPLE).map(([k,p])=>{ const other = linked && claimedBy(k) && claimedBy(k)!==H.MYID;
      return `<button class="btn ghost" data-pick="${k}" ${other?"disabled":""}><i class="flag ${p.flag}"></i>${p.name}${other?" (ya vinculado a otra cuenta)":""}</button>`; }).join("")}</div>
    ${linked && Object.keys(PEOPLE).some(k=>claimedBy(k) && claimedBy(k)!==H.MYID) ? `<p class="small muted">Si una persona aparece vinculada por error, Andrés puede liberarla desde Ajustes con "Desvincular todo".</p>` : ""}

document.addEventListener("click", e => {

});

function wireDnD(){
  document.querySelectorAll("[data-drag]").forEach(c => c.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", c.dataset.drag); e.dataTransfer.effectAllowed = "move"; }));
  document.querySelectorAll("[data-drop]").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", e => { e.preventDefault(); col.classList.remove("over"); const id = e.dataTransfer.getData("text/plain"); if (id) H.dropPiece(id, col.dataset.drop); });
  });
}

/* ===================== conexión ===================== */
async function connect(){
  render();
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e){ db = null; }
  H.CONNECTING = false;
  if (!db){ H.NODB = true; COLS.forEach(c=>S.loaded[c]=true); render(); return; }
  H.DB = db;
  const onErr = e => { if (e && e.code==="revoked"){ H.NODB = true; render(); } };
  COLS.forEach(c => db.collection(c).onSnapshot(snap => {
    S[c] = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    S.loaded[c] = true; H.schedule();
  }, onErr));
  Object.entries(CFG).forEach(([k,p]) => db.doc(p).onSnapshot(snap => { S[k] = snap.exists ? { ...snap.data() } : null; S.loaded[k] = true; if (k==="people") syncMe(); H.schedule(); }, onErr));
  try {
    const user = window.claude.use ? await window.claude.use("user") : null; H.USER = user;
    if (user){
      try { H.MYID = await user.id(); } catch(e){ H.MYID = null; }
      if (user.can){ const ok = await user.can("data.write"); H.CANWRITE = ok; if (ok===false){ H.READONLY = true; } }
      syncMe(); render();
    }
  } catch(e){}
  setTimeout(() => { if (!H.ME && !$("#dlg").open) H.chooseMe(); }, 1200);
}
connect();
})();
